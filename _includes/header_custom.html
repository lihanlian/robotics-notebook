<button class="global-theme-toggle" id="global-theme-toggle" aria-label="Toggle theme" title="Toggle theme">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1.5" x2="12" y2="4.5"></line>
    <line x1="12" y1="19.5" x2="12" y2="22.5"></line>
    <line x1="1.5" y1="12" x2="4.5" y2="12"></line>
    <line x1="19.5" y1="12" x2="22.5" y2="12"></line>
    <line x1="4.2" y1="4.2" x2="6.3" y2="6.3"></line>
    <line x1="17.7" y1="17.7" x2="19.8" y2="19.8"></line>
    <line x1="17.7" y1="6.3" x2="19.8" y2="4.2"></line>
    <line x1="4.2" y1="19.8" x2="6.3" y2="17.7"></line>
  </svg>
</button>

<script>
  (function() {
    var btn = document.getElementById('global-theme-toggle');
    if (!btn || !window.jtd || typeof jtd.getTheme !== 'function' || typeof jtd.setTheme !== 'function') return;

    function syncButton() {
      var label = jtd.getTheme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
    }

    syncButton();
    jtd.addEvent(btn, 'click', function() {
      var nextTheme = jtd.getTheme() === 'dark' ? 'light' : 'dark';
      jtd.setTheme(nextTheme);
      syncButton();
    });
  })();
</script>
